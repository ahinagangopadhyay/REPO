<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fancy Login</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="page-shell">
    <div class="glass-card">
      <div class="brand-bar">
        <div class="brand-logo">L</div>
        <div>
          <h1>Logij</h1>
          <p>Secure access with style</p>
        </div>
      </div>
      <form id="loginForm" class="login-form" autocomplete="off">
        <div class="input-group">
          <label for="email">Email address</label>
          <input id="email" name="email" type="email" placeholder="you@example.com" required />
        </div>
        <div class="input-group">
          <label for="password">Password</label>
          <div class="password-field">
            <input id="password" name="password" type="password" placeholder="Enter your password" required />
            <button type="button" id="togglePassword" aria-label="Show password">Show</button>
          </div>
        </div>
        <div class="actions-row">
          <label class="checkbox-label">
            <input type="checkbox" id="remember" name="remember" />
            Remember me
          </label>
          <a href="#" class="link">Forgot?</a>
        </div>
        <button type="submit" class="button primary">Sign In</button>
        <div class="divider">OR</div>
        <button type="button" class="button secondary">Continue with Google</button>
      </form>
      <p class="signup-text">New here? <a href="#">Create an account</a></p>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
